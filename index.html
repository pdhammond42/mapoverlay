<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Overlay</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  body { display: flex; }
  #controls { width: 18rem; padding: 0.75rem; box-sizing: border-box; overflow-y: auto; }
  #controls h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
  .place { margin-bottom: 0.75rem; }
  .place > label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
  .place form { display: flex; gap: 0.25rem; }
  .place input[type=text] { flex: 1; min-width: 0; }
  #messages { font-size: small; color: #a00; }
  #maps { position: relative; flex: 1; }
  .map { position: absolute; inset: 0; }
  .map.bottom { z-index: 1; }
  .map.top { z-index: 2; }
  .hint { font-size: small; color: #555; }
  @media (max-width: 40rem) {
    body { flex-direction: column; }
    #controls { width: 100%; }
  }
</style>
</head>
<body>
<div id="controls">
  <h1>Map Overlay</h1>
  <div class="place">
    <label for="loc_1">Place 1</label>
    <form data-map="1"><input type="text" id="loc_1" placeholder="Search…"><button>Go</button></form>
    <span><input type="radio" name="top" id="top_1" value="1"> <label for="top_1">on top</label></span>
  </div>
  <div class="place">
    <label for="loc_2">Place 2</label>
    <form data-map="2"><input type="text" id="loc_2" placeholder="Search…"><button>Go</button></form>
    <span><input type="radio" name="top" id="top_2" value="2" checked> <label for="top_2">on top</label></span>
  </div>
  <p><label for="opacity">Top map opacity</label><br>
     <input type="range" id="opacity" min="0" max="1" step="0.05" value="1"></p>
  <p class="hint">The top map draws only roads, railways, water outlines and place names, so the
    map beneath shows through. Pan and zoom the top map; the other keeps the same
    ground scale (corrected for latitude). Swap which is on top to pan the other.</p>
  <div id="messages"></div>
</div>
<div id="maps">
  <div id="map_1" class="map"></div>
  <div id="map_2" class="map"></div>
</div>
<script>
{ // Block scope: a global `top` would clash with window.top.
  // OpenFreeMap serves OpenMapTiles-schema vector tiles with no key.
  const BOTTOM_STYLE = 'https://tiles.openfreemap.org/styles/positron';
  const LINE = '#d81b60', WATER = '#1e88e5', PLACE = '#880e4f';
  const width = (lo, hi) => ['interpolate', ['exponential', 1.5], ['zoom'], 5, lo, 18, hi];

  // Lines only, on a transparent background: no area fills to hide the map beneath.
  const TOP_STYLE = {
    version: 8,
    sources: { omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' } },
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    layers: [
      { id: 'water', type: 'line', source: 'omt', 'source-layer': 'water',
        paint: { 'line-color': WATER, 'line-width': width(0.5, 2) } },
      { id: 'waterway', type: 'line', source: 'omt', 'source-layer': 'waterway',
        paint: { 'line-color': WATER, 'line-width': width(0.5, 3) } },
      { id: 'rail', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['==', ['get', 'class'], 'rail'],
        paint: { 'line-color': LINE, 'line-width': width(0.5, 2), 'line-dasharray': [3, 2] } },
      { id: 'minor', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 13,
        filter: ['in', ['get', 'class'], ['literal', ['minor', 'service']]],
        paint: { 'line-color': LINE, 'line-width': width(0.2, 4), 'line-opacity': 0.6 } },
      { id: 'tertiary', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 11,
        filter: ['==', ['get', 'class'], 'tertiary'],
        paint: { 'line-color': LINE, 'line-width': width(0.3, 6) } },
      { id: 'secondary', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 10,
        filter: ['==', ['get', 'class'], 'secondary'],
        paint: { 'line-color': LINE, 'line-width': width(0.4, 8) } },
      { id: 'trunk', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['in', ['get', 'class'], ['literal', ['motorway', 'trunk', 'primary']]],
        paint: { 'line-color': LINE, 'line-width': width(1, 12) } },
      { id: 'places', type: 'symbol', source: 'omt', 'source-layer': 'place',
        filter: ['match', ['get', 'class'],
          ['city', 'town'], true,
          ['village', 'suburb'], ['>=', ['zoom'], 11],
          ['neighbourhood', 'quarter'], ['>=', ['zoom'], 13],
          false],
        layout: {
          'text-field': ['coalesce', ['get', 'name:latin'], ['get', 'name']],
          'text-font': ['match', ['get', 'class'], ['city', 'town'], ['literal', ['Noto Sans Bold']],
                        ['literal', ['Noto Sans Regular']]],
          'text-size': ['match', ['get', 'class'], 'city', 16, 'town', 14, 12],
          'symbol-sort-key': ['match', ['get', 'class'], 'city', 0, 'town', 1, 2],
        },
        paint: { 'text-color': PLACE, 'text-halo-color': '#fff', 'text-halo-width': 1.5 } },
    ],
  };

  const DEFAULTS = { 1: [-0.1278, 51.5074], 2: [-74.0060, 40.7128], zoom: 9, top: 2 };
  const maps = {};
  let top = 2, syncing = false;
  const styleOf = {}; // style each map has, so a swap only restyles what changes

  function message(msg) {
    const p = document.createElement('p');
    p.textContent = msg;
    document.getElementById('messages').replaceChildren(p);
  }

  function other(n) { return n === 1 ? 2 : 1; }

  // Web Mercator metres-per-pixel is proportional to cos(lat) / 2^zoom, so
  // equal ground scale needs zoom offset log2(cos(latB) / cos(latA)).
  function sync() {
    if (syncing) return;
    syncing = true;
    const lead = maps[top], follow = maps[other(top)];
    const rad = d => d * Math.PI / 180;
    follow.jumpTo({ zoom: lead.getZoom() +
      Math.log2(Math.cos(rad(follow.getCenter().lat)) / Math.cos(rad(lead.getCenter().lat))) });
    syncing = false;
    saveHash();
  }

  function setTop(n) {
    top = n;
    for (const m of [n, other(n)]) {
      const isTop = m === n;
      const c = maps[m].getContainer();
      c.classList.toggle('top', isTop);
      c.classList.toggle('bottom', !isTop);
      const want = isTop ? TOP_STYLE : BOTTOM_STYLE;
      if (styleOf[m] !== want) { maps[m].setStyle(want); styleOf[m] = want; }
    }
    applyOpacity();
    document.getElementById('top_' + n).checked = true;
    sync();
  }

  function applyOpacity() {
    maps[top].getContainer().style.opacity = document.getElementById('opacity').value;
    maps[other(top)].getContainer().style.opacity = 1;
  }

  async function search(n, query) {
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' +
                  encodeURIComponent(query);
      const res = await fetch(url, { headers: { 'Accept-Language': navigator.language } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const results = await res.json();
      if (!results.length) { message(query + ' was not found'); return; }
      message('');
      maps[n].jumpTo({ center: [+results[0].lon, +results[0].lat] });
      sync();
    } catch (e) {
      message('Search failed: ' + e.message);
    }
  }

  // State in the URL hash so a comparison can be bookmarked or shared:
  // #lat1,lng1,lat2,lng2,zoomOfTop,top
  function saveHash() {
    const c1 = maps[1].getCenter(), c2 = maps[2].getCenter(), f = x => x.toFixed(5);
    history.replaceState(null, '', '#' + [f(c1.lat), f(c1.lng), f(c2.lat), f(c2.lng),
      maps[top].getZoom().toFixed(2), top].join(','));
  }

  function loadHash() {
    const v = location.hash.slice(1).split(',').map(Number);
    if (v.length !== 6 || v.some(isNaN)) return DEFAULTS;
    return { 1: [v[1], v[0]], 2: [v[3], v[2]], zoom: v[4], top: v[5] === 1 ? 1 : 2 };
  }

  const state = loadHash();
  for (const n of [1, 2]) {
    styleOf[n] = n === state.top ? TOP_STYLE : BOTTOM_STYLE;
    maps[n] = new maplibregl.Map({
      container: 'map_' + n, style: styleOf[n], center: state[n], zoom: state.zoom,
      attributionControl: n === 1 && {}, // one copy: both maps use the same data
      dragRotate: false, pitchWithRotate: false, touchPitch: false,
    });
    maps[n].touchZoomRotate.disableRotation();
    maps[n].addControl(new maplibregl.ScaleControl(), n === 1 ? 'bottom-left' : 'bottom-right');
    maps[n].on('move', () => { if (n === top) sync(); });
  }
  maps[1].addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
  maps[2].addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');

  for (const form of document.querySelectorAll('form[data-map]')) {
    form.addEventListener('submit', e => {
      e.preventDefault();
      search(+form.dataset.map, form.querySelector('input').value);
    });
  }
  for (const r of document.querySelectorAll('input[name=top]')) {
    r.addEventListener('change', () => setTop(+r.value));
  }
  document.getElementById('opacity').addEventListener('input', applyOpacity);

  setTop(state.top);
}
</script>
</body>
</html>
